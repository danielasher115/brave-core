substitutions:
  - description: |-
      Count the secure DNS tasks of each completed job for Brave's DoH metric.

      The hook, defined in the chromium_src override of this file, feeds
      SecureDnsCounter, which browser/misc_metrics/doh_metrics.cc reads.
    add_after_line:
      line: 'RecordJobHistograms(results, task_type);'
      code: |2-
          BRAVE_RECORD_DNS_COUNTS
