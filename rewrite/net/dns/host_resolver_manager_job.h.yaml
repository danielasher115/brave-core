substitutions:
  - description: |-
      Declare the Brave hook that keeps blocked .onion lookups local.

      The hook is defined in the chromium_src override of
      host_resolver_manager_job.cc.
    add_to_protected:
      class_name: HostResolverManager::Job
      code: |-
        // If .onion resolution is blocked for this job, drops the tasks that
        // would send the hostname to the system resolver or DoH. Returns true
        // if it completed the job from the hosts file instead.
        bool MaybeDropBlockedOnionTasks();
